name: Example Agent Governance PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.py"
      - "pyproject.toml"
      - "requirements/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: example-agent-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-checks:
    name: Policy + Compliance Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install governance toolkit
        run: |
          # Use registered package names to avoid dependency confusion.
          python -m pip install --upgrade pip
          pip install --no-cache-dir "agent-governance-toolkit[full]" "agent-os-kernel"

      - name: Collect changed policy files
        id: changed-policies
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              }
            );

            const policyFiles = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((name) => /(policy|policies)/i.test(name) && /\.ya?ml$/i.test(name));

            core.setOutput('count', String(policyFiles.length));
            core.setOutput('files', policyFiles.join('\n'));

      - name: Validate changed policy files
        id: policy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.changed-policies.outputs.count }}" = "0" ]; then
            {
              echo "status=pass"
              echo "validated_count=0"
              echo "failed_count=0"
              echo "details=No changed policy YAML files detected in this PR."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          validated=0
          failed=0
          details=""

          printf '%s\n' "${{ steps.changed-policies.outputs.files }}" > /tmp/changed_policy_files.txt

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ ! -f "$file" ]; then
              details+="- SKIP: $file (file not present in checkout)\n"
              continue
            fi

            validated=$((validated + 1))

            if python -m agent_os.policies.cli validate "$file" >/tmp/policy.out 2>&1; then
              details+="- PASS: $file\n"
            else
              failed=$((failed + 1))
              details+="- FAIL: $file\n"
              details+="$(sed 's/^/  /' /tmp/policy.out)\n"
            fi
          done < /tmp/changed_policy_files.txt

          if [ "$failed" -gt 0 ]; then
            status="fail"
          else
            status="pass"
          fi

          {
            echo "status=$status"
            echo "validated_count=$validated"
            echo "failed_count=$failed"
            echo "details<<EOF"
            printf "%b" "$details"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          [ "$failed" -eq 0 ]

      - name: Run compliance verification
        id: compliance
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if agent-governance verify --json >/tmp/compliance.json 2>/tmp/compliance.err; then
            status="pass"
          else
            status="fail"
          fi

          summary=$(python - << 'PY'
import json
from pathlib import Path

path = Path('/tmp/compliance.json')
if not path.exists() or path.stat().st_size == 0:
    print('Compliance report not available (command failed before JSON output).')
else:
    try:
        data = json.loads(path.read_text())
    except Exception:
        print('Compliance report exists but is not valid JSON.')
    else:
        passed = data.get('controls_passed', 'n/a')
        total = data.get('controls_total', 'n/a')
        grade = data.get('grade', 'n/a')
        print(f'Controls: {passed}/{total} | Grade: {grade}')
PY
)

          {
            echo "status=$status"
            echo "summary=$summary"
            echo "details<<EOF"
            if [ -s /tmp/compliance.err ]; then
              sed 's/^/  /' /tmp/compliance.err
            else
              echo "  No stderr output from compliance command."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$status" = "fail" ]; then
            cat /tmp/compliance.err || true
            exit 1
          fi

      - name: Build PR report
        id: report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          POLICY_STATUS="${{ steps.policy.outputs.status || 'fail' }}"
          POLICY_VALIDATED="${{ steps.policy.outputs.validated_count || '0' }}"
          POLICY_FAILED="${{ steps.policy.outputs.failed_count || '0' }}"
          POLICY_DETAILS="${{ steps.policy.outputs.details || 'No details available.' }}"

          COMPLIANCE_STATUS="${{ steps.compliance.outputs.status || 'fail' }}"
          COMPLIANCE_SUMMARY="${{ steps.compliance.outputs.summary || 'No summary available.' }}"
          COMPLIANCE_DETAILS="${{ steps.compliance.outputs.details || 'No details available.' }}"

          if [ "$POLICY_STATUS" = "pass" ]; then
            POLICY_ICON="PASS"
          else
            POLICY_ICON="FAIL"
          fi

          if [ "$COMPLIANCE_STATUS" = "pass" ]; then
            COMP_ICON="PASS"
          else
            COMP_ICON="FAIL"
          fi

          {
            echo "<!-- agent-governance-example-report -->"
            echo "## Agent Governance PR Report"
            echo
            echo "This report was generated automatically for this PR."
            echo
            echo "### Policy Validation"
            echo "- Status: $POLICY_ICON"
            echo "- Files validated: $POLICY_VALIDATED"
            echo "- Failed: $POLICY_FAILED"
            echo
            echo "Details:"
            echo
            echo '```text'
            printf "%b\n" "$POLICY_DETAILS"
            echo '```'
            echo
            echo "### Compliance Check"
            echo "- Status: $COMP_ICON"
            echo "- Summary: $COMPLIANCE_SUMMARY"
            echo
            echo "Command output:"
            echo
            echo '```text'
            printf "%b\n" "$COMPLIANCE_DETAILS"
            echo '```'
            echo
            echo "_Generated by .github/workflows/example-agent-governance.yml_"
          } > "$RUNNER_TEMP/governance-report.md"

      - name: Add job summary
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/governance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment results on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/governance-report.md`, 'utf8');
            const marker = '<!-- agent-governance-example-report -->';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.data.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job when checks fail
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          policy_status="${{ steps.policy.outputs.status || 'fail' }}"
          compliance_status="${{ steps.compliance.outputs.status || 'fail' }}"

          if [ "$policy_status" != "pass" ] || [ "$compliance_status" != "pass" ]; then
            echo "One or more governance checks failed."
            exit 1
          fi